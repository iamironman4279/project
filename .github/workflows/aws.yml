name: 🚀 Deploy Medusa Store to AWS ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: medusa-ecs-cluster
      SERVICE_NAME: medusa-service
      TASK_NAME: medusa-task
      ECR_IMAGE_URI: 551140580894.dkr.ecr.us-east-1.amazonaws.com/my_repo:latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Build and Push Docker image to ECR
        run: |
          docker build -t $ECR_IMAGE_URI .
          docker push $ECR_IMAGE_URI
          echo "IMAGE_URI=$ECR_IMAGE_URI" >> $GITHUB_ENV

      - name: 📦 Update ECS task definition
        id: update-task-def
        run: |
          IMAGE="$ECR_IMAGE_URI"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $TASK_NAME \
            --region $AWS_REGION)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            '.taskDefinition |
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = [
              {"name":"NODE_ENV","value":"production"},
              {"name":"DATABASE_URL","value":"postgres://admin123:admin717@medusa-db.cluster-cmviaqawigqs.us-east-1.rds.amazonaws.com/medusadb"},
              {"name":"ADMIN_CORS","value":"*"},
              {"name":"STORE_CORS","value":"*"},
              {"name":"AUTH_CORS","value":"*"},
              {"name":"JWT_SECRET","value":"supersecret"},
              {"name":"COOKIE_SECRET","value":"supersecret"}
            ] |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          echo "$NEW_TASK_DEF" > new-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --region $AWS_REGION \
            | jq -r '.taskDefinition.taskDefinitionArn')

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: 🚀 Update ECS service
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --task-definition ${{ steps.update-task-def.outputs.task_definition_arn }} \
            --force-new-deployment \
            --region $AWS_REGION

      - name: ⏳ Wait for ECS Deployment to Stabilize
        run: |
          for i in {1..40}; do
            STATUS=$(aws ecs describe-services \
              --cluster $CLUSTER_NAME \
              --services $SERVICE_NAME \
              --region $AWS_REGION \
              --query 'services[0].deployments[0].rolloutState' \
              --output text)

            DESIRED=$(aws ecs describe-services \
              --cluster $CLUSTER_NAME \
              --services $SERVICE_NAME \
              --region $AWS_REGION \
              --query 'services[0].desiredCount' \
              --output text)

            RUNNING=$(aws ecs describe-services \
              --cluster $CLUSTER_NAME \
              --services $SERVICE_NAME \
              --region $AWS_REGION \
              --query 'services[0].runningCount' \
              --output text)

            echo "⏳ Attempt $i/40 - Status: $STATUS | Running: $RUNNING / Desired: $DESIRED"

            if [[ "$STATUS" == "COMPLETED" && "$RUNNING" -eq "$DESIRED" ]]; then
              echo "✅ ECS deployment stabilized!"
              exit 0
            fi

            sleep 15
          done

          echo "❌ ECS deployment did not stabilize."
          exit 1

      # Optional: Uncomment if you want to test the API after deployment
      # - name: 🧪 Test API
      #   run: |
      #     curl --fail http://<your-api-domain>/store/products || {
      #       echo "❌ API not responding"
      #       exit 1
      #     }
