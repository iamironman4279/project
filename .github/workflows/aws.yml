name: Deploy Medusa Store to AWS ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image to ECR
        run: |
          IMAGE_URI=551140580894.dkr.ecr.us-east-1.amazonaws.com/my_repo:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Update ECS task definition
        id: update-task-def
        run: |
          IMAGE="${{ env.IMAGE_URI }}"
          
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition medusa-task \
            --region us-east-1)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            '.taskDefinition |
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = [
              {"name":"NODE_ENV","value":"production"},
              {"name":"DATABASE_URL","value":"postgres://admin123:admin717@medusa-db.cluster-cmviaqawigqs.us-east-1.rds.amazonaws.com/medusadb"},
              {"name":"ADMIN_CORS","value":"*"},
              {"name":"STORE_CORS","value":"*"},
              {"name":"AUTH_CORS","value":"*"},
              {"name":"JWT_SECRET","value":"supersecret"},
              {"name":"COOKIE_SECRET","value":"supersecret"}
            ] |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --region us-east-1 \
            --cli-input-json "$NEW_TASK_DEF" \
            | jq -r '.taskDefinition.taskDefinitionArn')

          echo "task_definition_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster medusa-ecs-cluster \
            --service medusa-service \
            --task-definition ${{ steps.update-task-def.outputs.task_definition_arn }} \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for ECS service to stabilize
        timeout-minutes: 20
        run: |
          for i in {1..40}; do
            STATUS=$(aws ecs describe-services \
              --cluster medusa-ecs-cluster \
              --services medusa-service \
              --region us-east-1 \
              --query 'services[0].deployments[0].rolloutState' \
              --output text)
            echo "⏳ Deployment status: $STATUS"
            if [ "$STATUS" = "COMPLETED" ]; then
              echo "✅ Service is stable!"
              exit 0
            fi
            sleep 30
          done
          echo "❌ Deployment did not stabilize in time"
          exit 1
